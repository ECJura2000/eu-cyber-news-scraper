name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install locked build environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen --all-extras
      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'from eu_cyber_news_scraper import __version__; print(__version__)')
          test "$REF_NAME" = "v$version"
      - name: Validate and build
        run: |
          uv run ruff check .
          uv run mypy src/eu_cyber_news_scraper
          uv run pytest --cov=eu_cyber_news_scraper --cov-fail-under=92
          uv run python -m build
          cd dist
          sha256sum * > SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
