name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install locked build environment
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen --all-extras
      - name: Verify tag matches package version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(uv run python -c 'from eu_cyber_news_scraper import __version__; print(__version__)')
          test "$REF_NAME" = "v$version"
      - name: Validate and build
        run: |
          uv run ruff check .
          uv run mypy src/eu_cyber_news_scraper
          uv run pytest --cov=eu_cyber_news_scraper --cov-fail-under=90
          uv run python -m build
          cd dist
          sha256sum * > SHA256SUMS
      - name: Attest release distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
