name: Weekly official cyber news

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to look back
        default: "14"
        required: true
  schedule:
    - cron: "0 0 * * 1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: python -m pip install -e .
      - name: Smoke-test critical sources without translation
        run: >-
          python -m eu_cyber_news_scraper --days 60 --all --no-translate
          --source eu_dg_connect --source eu_enisa_news --source fr_anssi
          --source fr_cybermalveillance --source de_bsi_news --source ie_ncsc
          --source ie_comreg --output /tmp/critical-source-smoke.xlsx --fail-on-degraded
      - name: Scrape official sources
        run: python -m eu_cyber_news_scraper --days "${{ inputs.days || '14' }}" --jsonl --fail-on-degraded
      - uses: actions/upload-artifact@v7
        with:
          name: eu-cyber-news-${{ github.run_id }}
          path: 新聞放置區/*
          if-no-files-found: error
          retention-days: 30
