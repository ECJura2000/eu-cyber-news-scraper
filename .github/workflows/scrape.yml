name: Weekly official cyber news

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to look back; leave blank when using since/until
        default: ""
        required: false
      since:
        description: Start date, Gregorian or ROC calendar
        required: false
      until:
        description: Inclusive end date, Gregorian or ROC calendar
        required: false
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: weekly-eu-cyber-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout durable state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: .state-branch
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen --no-dev
      - name: Restore durable state
        run: |
          mkdir -p .state
          cp .state-branch/.source-health.json .state/ 2>/dev/null || true
          cp .state-branch/translations.json .state/ 2>/dev/null || true
      - name: Smoke-test critical sources without translation
        run: >-
          uv run python -m eu_cyber_news_scraper --days 60 --all --no-translate
          --health-write never --state-dir .state
          --source eu_dg_connect --source eu_enisa_news --source fr_anssi
          --source fr_cybermalveillance --source de_bsi_news --source ie_ncsc
          --source ie_comreg --output /tmp/critical-source-smoke.xlsx --fail-on-degraded
      - name: Scrape official sources
        id: scrape
        shell: bash
        env:
          DAYS: ${{ inputs.days }}
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --jsonl
            --fail-on-degraded
            --state-dir .state
            --source-budget 60
            --min-source-success-rate 0.95
            --min-parse-success-rate 0.95
            --max-empty-sources 1
            --min-overall-date-rate 0.75
            --min-critical-date-rate 0.95
            --max-unexplained-future-dates 0
            --require-complete-artifacts
          )
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            args+=(--health-write always)
          else
            args+=(--health-write auto)
          fi
          if [[ -n "$SINCE" || -n "$UNTIL" ]]; then
            args+=(--since "$SINCE" --until "$UNTIL")
          else
            args+=(--days "${DAYS:-14}")
          fi
          uv run python -m eu_cyber_news_scraper "${args[@]}"
      - name: Persist durable state
        if: always()
        working-directory: .state-branch
        run: |
          if [[ ! -f ../.state/.state-ready ]]; then
            echo "Run is not baseline-eligible; durable state will not advance (RUN_NOT_BASELINE_ELIGIBLE)."
            exit 0
          fi
          cp ../.state/.source-health.json . 2>/dev/null || true
          cp ../.state/translations.json . 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- .source-health.json translations.json
          git diff --cached --quiet || git commit -m "Update scraper state for run $GITHUB_RUN_ID"
          git push origin state
      - name: Report and reconcile source health issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(find 新聞放置區 -maxdepth 1 -name '*.run.json' -type f -print 2>/dev/null | sort | tail -1 || true)
          if [[ -z "$summary" && -f /tmp/critical-source-smoke.run.json ]]; then
            summary=/tmp/critical-source-smoke.run.json
          fi
          if [[ -z "$summary" ]]; then
            exit 0
          fi
          degraded=$(uv run python - "$summary" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              payload = json.load(source)
          degraded = [row["source_id"] for row in payload["sources"] if row["health_status"] == "degraded"]
          critical = [
              row["source_id"]
              for row in payload["sources"]
              if row["critical"] and row["health_status"] == "degraded"
          ]
          quality = [row["code"] for row in payload.get("quality_gate", {}).get("failures", [])]
          attention = [row["source_id"] for row in payload["sources"] if row["health_status"] == "attention"]
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              stream.write(
                  "## EU cyber news source health\n\n"
                  f"Attention: {', '.join(attention) or 'none'}\n\n"
                  f"Degraded: {', '.join(degraded) or 'none'}\n\n"
                  f"Quality failures: {', '.join(quality) or 'none'}\n"
              )
          print(" ".join([*critical, *quality]))
          PY
          )
          issue=$(gh issue list --state open --search '"EU cyber news source health" in:title' --json number --jq '.[0].number // empty')
          if [[ -n "$degraded" ]]; then
            body=$(printf 'Run %s detected degraded critical sources or quality failures: %s\n\n%s/%s/actions/runs/%s' "$GITHUB_RUN_ID" "$degraded" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "EU cyber news source health" --body "$body"
            fi
          elif [[ -n "$issue" ]]; then
            gh issue close "$issue" --comment "Sources and quality gates recovered in run $GITHUB_RUN_ID."
          fi
      - name: Upload completed news artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.scrape.outcome == 'success'
        with:
          name: eu-cyber-news-${{ github.run_id }}
          path: 新聞放置區/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: eu-cyber-news-diagnostics-${{ github.run_id }}
          path: |
            /tmp/critical-source-smoke.*
            新聞放置區/*
          if-no-files-found: warn
          retention-days: 30
