name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.29
      - name: Sync locked environment
        run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run mypy src/eu_cyber_news_scraper
      - run: uv run pytest --cov=eu_cyber_news_scraper --cov-report=term-missing --cov-fail-under=90
      - run: uv run pip-audit
      - name: Build and install distributions
        if: matrix.python-version == '3.13'
        run: |
          uv run python -m build
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/eu-cyber-news --list-sources >/dev/null
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install dist/*.tar.gz
          /tmp/sdist-test/bin/python -c "import eu_cyber_news_scraper"
