name: EU27 central ministry source audit

on:
  workflow_dispatch:
    inputs:
      country:
        description: Optional EU member country code; blank checks all 27 countries
        required: false
  schedule:
    - cron: "15 1 * * 3"

permissions:
  contents: read
  actions: read

concurrency:
  group: eu-central-ministry-audit
  cancel-in-progress: false

jobs:
  countries:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.select.outputs.countries }}
    steps:
      - name: Select EU countries
        id: select
        env:
          COUNTRY: ${{ inputs.country }}
        run: |
          python3 - <<'PY'
          import json, os
          countries = "AT BE BG CY CZ DE DK EE ES FI FR GR HR HU IE IT LT LU LV MT NL PL PT RO SE SI SK".split()
          country = os.environ.get("COUNTRY", "").strip().upper()
          if country and country not in countries:
              raise SystemExit("Invalid EU member country code")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("countries=" + json.dumps([country] if country else countries) + "\n")
          PY
  audit:
    needs: countries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        country: ${{ fromJSON(needs.countries.outputs.countries) }}
    env:
      COUNTRY: ${{ matrix.country }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install locked runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen --no-dev
      - name: Validate inventory and source references
        run: |
          uv run python scripts/generate_organisation_registry.py --check
          uv run python -m eu_cyber_news_scraper ministries --check --country "$COUNTRY"
      - name: Restore country observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ministry-inventory/history
          restored=false
          previous_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ministry-audit.yml --branch main --status completed --limit 15 --json databaseId --jq '.[].databaseId' || true)
          while IFS= read -r previous; do
            if [[ -z "$previous" ]]; then continue; fi
            staging=$(mktemp -d "$RUNNER_TEMP/ministry-inventory.XXXXXX")
            if gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name "ministry-inventory-state-$COUNTRY" --dir "$staging"; then
              if [[ -z "$(find "$staging/history" -type f -name '*.json' -print -quit 2>/dev/null || true)" ]]; then continue; fi
              cp -a "$staging/history/." .ministry-inventory/history/
              restored=true
              break
            fi
          done <<< "$previous_runs"
          if [[ "$restored" == false ]]; then
            echo "No country-specific history available; trying the previous shared diagnostic inventory."
            legacy_runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow source-audit.yml --branch main --status completed --limit 15 --json databaseId --jq '.[].databaseId' || true)
            while IFS= read -r previous; do
              if [[ -z "$previous" ]]; then continue; fi
              staging=$(mktemp -d "$RUNNER_TEMP/ministry-legacy.XXXXXX")
              if gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name source-inventory-state --dir "$staging"; then
                if [[ -z "$(find "$staging/history" -type f -name '*.json' -print -quit 2>/dev/null || true)" ]]; then continue; fi
                cp -a "$staging/history/." .ministry-inventory/history/
                restored=true
                break
              fi
            done <<< "$legacy_runs"
          fi
          if [[ "$restored" == false ]]; then
            echo "No restorable observation history; starting a new diagnostic baseline."
          fi
      - name: Audit country sources
        run: |
          uv run python -m eu_cyber_news_scraper.source_audit --country "$COUNTRY" --parse --days 30 --timeout 15 --workers 8 --output-dir "source-audit/$COUNTRY" --history-dir .ministry-inventory/history --allow-unhealthy
      - name: Audit unresolved ministry URLs
        if: always()
        run: |
          status=0
          uv run python -m eu_cyber_news_scraper ministries --country "$COUNTRY" --audit-urls --output-dir "source-audit/$COUNTRY/inventory-urls" || status=$?
          if [[ "$status" -gt 1 ]]; then exit "$status"; fi
      - name: Publish country evidence
        if: always()
        run: |
          uv run python -m eu_cyber_news_scraper ministries --json --country "$COUNTRY" >> "$GITHUB_STEP_SUMMARY"
          printf '\nEndpoint and parser failures are recorded in the country artifact. Diagnostic completion does not enable any weekly sources.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Save country observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ministry-inventory-state-${{ matrix.country }}
          path: .ministry-inventory/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Upload country diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ministry-audit-${{ matrix.country }}-${{ github.run_id }}
          path: source-audit/
          if-no-files-found: warn
          retention-days: 90
