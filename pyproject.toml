[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-cyber-news-scraper"
version = "1.1.0"
description = "Official EU, French, German and Irish cybersecurity news scraper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "dateparser>=1.2.2,<2",
  "googletrans>=4.0.2,<5",
  "translate>=3.6.1,<4",
  "translatepy>=2.3,<3",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "lxml>=5.3,<7",
  "openpyxl>=3.1.5,<4",
  "opencc-python-reimplemented>=0.1.7,<1",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pip-audit>=2.9,<3",
  "ruff>=0.11,<1",
]

[project.scripts]
eu-cyber-news = "eu_cyber_news_scraper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eu_cyber_news_scraper = ["sources.toml", "authority_coverage.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["bs4.*", "dateparser.*", "feedparser.*", "googletrans.*", "opencc.*", "openpyxl.*", "translate.*", "translatepy.*"]
ignore_missing_imports = true
